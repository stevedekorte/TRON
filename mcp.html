<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#010207"><title>ENCOM TERMINAL — MCP</title>
<link rel="stylesheet" href="/src/mcp/style.css">
<script src="./bit/exit-confirm.js"></script>
</head>
<body class="mcp-terminal">
<main>
 <img id="face-fallback" src="/docs/references/images/MCP/MCP.png" alt="Master Control Program"><canvas id="face" aria-label="The Master Control Program's animated face"></canvas>
 <section id="controls" aria-label="MCP controls and status">
  <div id="control-row">
   <button disabled id="microphone" type="button" aria-pressed="false">MIC ON</button>
   <span class="status-button" id="voice-status" role="status">TTS — PREPARING…</span>
  </div>
  <div id="download-row"><progress id="voice-progress" max="1" value="0" aria-label="Total MCP voice download"></progress><span id="download-detail">CONNECTING TO VOICE SERVICE</span></div>
  <p id="status" role="status">STARTING MCP…</p>
  <div id="voice-controls"><button id="voice-sample" type="button">HEAR VOICE SAMPLE</button><button id="load-voice" type="button">CONNECT MCP VOICE</button><button id="test-voice" type="button" disabled>TEST VOICE</button></div>
 </section>
 <section id="conversation" aria-label="Conversation with MCP">
  <p id="heard"></p><p id="reply" aria-live="polite">CONNECTING TO CORE...</p>
  <form id="message-form"><label class="sr-only" for="message">Message to MCP</label><input disabled id="message" maxlength="1000" autocomplete="off" placeholder="SPEAK OR TYPE YOUR MESSAGE"></form>
 </section>
 <div id="encom-panel" role="img" aria-label="ENCOM control panel"></div>
</main>
<script>
window.mcpBootTimer=setTimeout(()=>{if(!window.mcpBooted)document.getElementById('status').textContent='MCP IS TAKING LONGER TO START — TRY RELOADING';},15000);
</script>
<script type="module" src="/src/mcp/main.js" onerror="document.getElementById('status').textContent='MCP COULD NOT START — RELOAD THIS PAGE'"></script>
</body></html>
