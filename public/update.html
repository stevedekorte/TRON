<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update ENCOM Terminal</title>
<link rel="preload" href="./fonts/InterfaceRaster-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:FilmTerminal;src:url('./fonts/InterfaceRaster-Regular.ttf') format('truetype');font-style:normal;font-weight:400;font-display:swap}
:root{color-scheme:dark;--terminal-font-size:min(1.5vw,2.15vh)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#020204;color:#159ddd;font:400 var(--terminal-font-size)/1.12 FilmTerminal,monospace;letter-spacing:.025em;text-shadow:0 0 3px #0a91db,0 0 10px #005b9566}
main{position:absolute;top:27.5vh;left:20.4vw;width:75%;padding-right:4vw}
p{margin:0 0 2.08em}
a{display:inline-flex;align-items:center;gap:1ch;color:inherit;text-decoration:none}
a::before{content:'';display:inline-block;flex:none;width:.48em;height:.78em;background:currentColor;box-shadow:0 0 5px #0a91db;animation:blink .85s steps(1) infinite}
a:focus-visible{outline:1px solid currentColor;outline-offset:7px}
a:hover{color:#a6e2ff}
.encom{position:fixed;right:4vw;bottom:15vh;width:clamp(85px,9.5vw,190px);height:auto;opacity:.8;filter:drop-shadow(0 0 2px #898fc9) drop-shadow(0 0 5px #626eb855)}
@keyframes blink{50%{opacity:0}}
@media(max-width:700px){main{left:7vw;width:90%}body{font-size:max(14px,var(--terminal-font-size))}}
@media(prefers-reduced-motion:reduce){a::before{animation:none}}
</style></head>
<body><main><p id="status" role="status" aria-live="polite">UPDATING ENCOM TERMINAL...</p><a href="./">RETURN TO ENCOM TERMINAL</a></main>
<img class="encom" src="./images/encom-terminal.svg" alt="ENCOM" width="210" height="62">
<script type="module">
const status=document.querySelector('#status');
try{
 if(!('serviceWorker' in navigator)){location.replace('./');}
 else{
  let activating=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(activating)location.replace('./');});
  const registration=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});
  const apply=()=>{if(registration.waiting){activating=true;registration.waiting.postMessage({type:'ACTIVATE_UPDATE'});return true;}return false;};
  registration.addEventListener('updatefound',()=>registration.installing?.addEventListener('statechange',()=>{
   if(!apply()&&registration.installing?.state==='redundant')status.textContent='UPDATE COULD NOT FINISH. RELOAD TO RETRY.';
  }));
  await registration.update();
  if(!apply()&&!registration.installing){status.textContent='ENCOM TERMINAL IS UP TO DATE.';location.replace('./');}
 }
}catch(error){status.textContent='UPDATE COULD NOT FINISH. CHECK YOUR CONNECTION AND RELOAD.';console.error(error);}
</script></body></html>
