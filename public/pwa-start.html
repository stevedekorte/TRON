<!doctype html>
<!-- Loaded in a hidden iframe by src/pwa/launch.js when TRON starts as an
     installed app, so each app start shows up in Cloudflare Web Analytics
     as a view of this path (unless the browser opted out with ?analytics=off).
     Not precached, so offline starts aren't counted. -->
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>TRON app start</title></head>
<body>
<template data-colvmn-analytics>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "34961f34a36c46ba998af2f06a76183e"}'></script>
</template>
<script>(function(){var k="colvmn:no-analytics",me=document.currentScript;try{var m=/[?&]analytics=(off|on)\b/.exec(location.search);if(m){if(m[1]==="off")localStorage.setItem(k,"1");else localStorage.removeItem(k);console.info("analytics "+m[1]+" for this browser")}if(localStorage.getItem(k))return}catch(e){}var t=me.previousElementSibling;t.content.childNodes.forEach(function(n){var c;if(n.nodeName==="SCRIPT"){c=document.createElement("script");for(var i=0;i<n.attributes.length;i++)c.setAttribute(n.attributes[i].name,n.attributes[i].value);if(!n.hasAttribute("async"))c.async=false;c.text=n.text}else c=document.importNode(n,true);me.parentNode.insertBefore(c,me)})})();</script>
</body></html>
